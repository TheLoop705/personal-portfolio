<text x="68" y="612.5" fill="#5b6b7b" font-size="10.5" text-anchor="start" xml:space="preserve">between an app and the stack.</text>
<text x="68" y="627.6" fill="#5b6b7b" font-size="10.5" text-anchor="start" xml:space="preserve">Swap backends freely.</text>
